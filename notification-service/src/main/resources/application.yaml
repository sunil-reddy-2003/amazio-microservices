server:
  port: 8085

spring:
  application:
    name: notification-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 120000
      max-lifetime: 300000
      keepalive-time: 60000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false


  kafka:
    #    bootstrap-servers: localhost:9092,localhost:9093,localhost:9094
    bootstrap-servers: ${KAFKA_HOST}:${KAFKA_PORT}
    properties:
      security.protocol: SASL_SSL
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME}" password="${KAFKA_PASSWORD}";
      ssl.truststore.location: ${KAFKA_SSL_TRUSTSTORE_LOCATION}
      ssl.truststore.password: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      ssl.truststore.type: JKS
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.amazio.notification_service.dto
        spring.json.use.type.headers: false

jwt:
  access:
    expiration:
      time: ${JWT_ACCESS_EXPIRATION}
    secret:
      password: ${JWT_ACCESS_SECRET}

change-password-url: ${CHANGE_PASSWORD_URL}
password-reset-url: ${PASSWORD_RESET_URL}
home-url: ${HOME_URL}

gmail: ${GMAIL}
gmail-password: ${GMAIL_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never