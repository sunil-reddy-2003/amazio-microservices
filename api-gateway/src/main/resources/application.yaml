server:
  port: 8080

spring:
  application:
    name: api-gateway


  cloud:
    gateway:
      server:
        webmvc:
          routes:

            # USER SERVICE
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/addresses/**

            # PRODUCT SERVICE
            - id: product-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/products/**,/api/v1/admin/products/**

            # ORDER SERVICE
            - id: order-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/orders/**

            # INVENTORY SERVICE
            - id: inventory-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/v1/inventory/**
          cors:
            configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                  - "https://amazio-frontend.vercel.app"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - Authorization
                  - Content-Type
                allowCredentials: true

jwt:
  access:
    expiration:
      time: ${JWT_ACCESS_EXPIRATION}
    secret:
      password: ${JWT_ACCESS_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never